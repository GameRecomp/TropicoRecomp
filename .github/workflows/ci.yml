# SPDX-License-Identifier: MIT
# CI has no game copy: it builds and tests the tools and the runtime on
# fixtures, and checks that the repository follows its rules.
name: ci

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/audit

  recompiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recomp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The pipeline must keep building for the browser.
      - run: >-
          cargo build --target wasm32-unknown-unknown
          -p rc-pe -p rc-manifest -p rc-discover -p rc-ir -p rc-x86 -p rc-emit-c -p rc-inno -p rc-emit-native
      # Lifted C against the real CPU in 32-bit mode.
      - run: cargo run --release -p rc-difftest

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Warnings are errors with GCC and Clang; MSVC's /W4 conversion
      # warnings are reported but do not fail the build.
      - name: configure
        shell: bash
        run: >-
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Debug
          -DRC_WARNINGS_AS_ERRORS=${{ matrix.os == 'windows-latest' && 'OFF' || 'ON' }}
      - name: build
        run: cmake --build build/ci --config Debug
      - name: test
        run: ctest --test-dir build/ci -C Debug --output-on-failure
