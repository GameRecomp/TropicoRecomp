# SPDX-License-Identifier: MIT
# CI has no game copy: it builds and tests the tools and the runtime on
# fixtures, and checks that the repository follows its rules.
name: ci

# Manual runs only for now; push and pull_request are off.
on:
  # push:
  # pull_request:
  workflow_dispatch:

jobs:
  platforms:
    # The systems the runtime is built and tested on: those platforms.json
    # has on, of Linux, macOS and Windows.
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.read.outputs.os }}
      any: ${{ steps.read.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          os=$(jq -c '[{linux: "ubuntu-latest", macos: "macos-latest", windows: "windows-latest"}
                       | to_entries[] | select($p[0][.key]) | .value]' --slurpfile p platforms.json -n)
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<< "$os")" >> "$GITHUB_OUTPUT"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/audit

  recompiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recomp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The pipeline must keep building for the browser.
      - run: >-
          cargo build --target wasm32-unknown-unknown
          -p rc-pe -p rc-manifest -p rc-discover -p rc-ir -p rc-x86 -p rc-emit-c -p rc-inno -p rc-emit-native -p rc-convert -p rc-web
      # Lifted C against the real CPU in 32-bit mode.
      - run: cargo run --release -p rc-difftest

  runtime:
    needs: platforms
    if: fromJSON(needs.platforms.outputs.any)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Warnings are errors with GCC and Clang; MSVC's /W4 conversion
      # warnings are reported but do not fail the build.
      - name: configure
        shell: bash
        run: >-
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Debug
          -DRC_WARNINGS_AS_ERRORS=${{ matrix.os == 'windows-latest' && 'OFF' || 'ON' }}
      - name: build
        run: cmake --build build/ci --config Debug
      - name: test
        run: ctest --test-dir build/ci -C Debug --output-on-failure
