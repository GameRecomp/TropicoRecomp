# SPDX-License-Identifier: MIT
# The converter site: the game shells of Tropico and Tropico 2 for Windows,
# Linux, macOS and Android and their web shells for playing in the browser
# (no game code in any of them),
# for the systems platforms.json has on, the converter compiled to
# WebAssembly, and the pages,
# published to GitHub Pages. Pages must be enabled with "GitHub Actions" as
# its source.
#
# Beside the site, the converter as a program for each desktop system that
# is on (converter-<system> artifacts: recomp and every template, so each
# builds for all systems); release-upload.yml puts them on a release.
name: converter

# Manual runs only for now; push is off.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    # The systems to build for: platforms.json (true or false each). A job
    # for a system that is off is skipped, and the site offers it as off.
    runs-on: ubuntu-22.04
    outputs:
      on: ${{ steps.read.outputs.on }}
      hosts: ${{ steps.read.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "on=$(jq -c . platforms.json)" >> "$GITHUB_OUTPUT"
          # The desktop systems the converter program is built for: the
          # runner and the name of the archive's architecture.
          hosts=$(jq -c '[{linux:   {os: "ubuntu-22.04", arch: "x86_64"},
                           windows: {os: "windows-latest", arch: "x86_64"},
                           macos:   {os: "macos-latest", arch: "universal"}}
                          | to_entries[] | select($p[0][.key]) | {system: .key} + .value]' \
                  --slurpfile p platforms.json -n)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

  icons:
    # The programs' icons, rendered from tools/appimage/<icon>.svg.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: tools/make-icons build/icons
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: build/icons

  shell-linux:
    needs: [platforms, icons]
    if: fromJSON(needs.platforms.outputs.on).linux
    # The oldest supported runner, so that the shell runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: SDL build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
          libdbus-1-dev libudev-dev libasound2-dev libpulse-dev libpipewire-0.3-dev
      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: build/icons
      - run: tools/build-shell build/out/tropico1-shell tropico1
      - run: tools/make-appimage build/out/tropico1-shell build/out/Tropico.AppImage build/icons tropico1
      - run: tools/build-shell build/out/tropico2-shell tropico2
      - run: tools/make-appimage build/out/tropico2-shell build/out/Tropico2.AppImage build/icons tropico2
      - uses: actions/upload-artifact@v4
        with:
          name: shell-linux
          path: |
            build/out/Tropico.AppImage
            build/out/Tropico2.AppImage

  shell-macos:
    needs: platforms
    if: fromJSON(needs.platforms.outputs.on).macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-shell build/out/Tropico tropico1
      - run: tools/build-shell build/out/Tropico2 tropico2
      - uses: actions/upload-artifact@v4
        with:
          name: shell-macos
          path: |
            build/out/Tropico
            build/out/Tropico2

  shell-windows:
    needs: [platforms, icons]
    if: fromJSON(needs.platforms.outputs.on).windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The icon the program's resources carry (games/tropico1/tropico1.rc.in).
      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: build/icons
      - run: tools/build-shell build/out/Tropico.exe tropico1
      - run: tools/build-shell build/out/Tropico2.exe tropico2
      - uses: actions/upload-artifact@v4
        with:
          name: shell-windows
          path: |
            build/out/Tropico.exe
            build/out/Tropico2.exe

  shell-android:
    needs: platforms
    if: fromJSON(needs.platforms.outputs.on).android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner has the Android SDK (ANDROID_HOME) and NDK
      # (ANDROID_NDK_LATEST_HOME).
      - run: tools/build-android build/out/Tropico-shell.apk tropico1
      - run: tools/build-android build/out/Tropico2-shell.apk tropico2
      - uses: actions/upload-artifact@v4
        with:
          name: shell-android
          path: |
            build/out/Tropico-shell.apk
            build/out/Tropico2-shell.apk

  shell-web:
    needs: platforms
    if: fromJSON(needs.platforms.outputs.on).web
    # The web shell: the runtime built with Emscripten (JSPI) for playing in
    # the browser, with the Liberation fonts the game's text needs.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten and build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build fonts-liberation
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.0
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.0
      - run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/build-web-shell build/out/web tropico1
          tools/build-web-shell build/out/web tropico2
      - uses: actions/upload-artifact@v4
        with:
          name: shell-web
          path: build/out/web

  templates:
    needs: [platforms, icons, shell-linux, shell-macos, shell-windows, shell-android]
    # Skipped shells (systems that are off) do not hold the templates back.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: build/shells
      - name: shell templates
        run: |
          cargo build --release --manifest-path recomp/Cargo.toml -p rc-cli
          mkdir -p build/templates
          on() { jq -e ".$1" platforms.json > /dev/null; }
          # Each game's template per system: Tropico-<system>.zip,
          # Tropico2-<system>.zip.
          for g in tropico1 tropico2; do
            . tools/game-info "$g"
            t() { recomp/target/release/recomp template --game "$g" --system "$@"; }
            if on linux; then
              t linux --shell "build/shells/shell-linux/$GAME_STEM.AppImage" -o "build/templates/$GAME_STEM-linux.zip"
            fi
            if on macos; then
              t macos --shell "build/shells/shell-macos/$GAME_STEM" -o "build/templates/$GAME_STEM-macos.zip" \
                --version "$(tools/version)" --icon "build/shells/icons/$GAME_ICON.icns"
            fi
            if on windows; then
              t windows --shell "build/shells/shell-windows/$GAME_STEM.exe" -o "build/templates/$GAME_STEM-windows.zip"
            fi
            if on android; then
              t android --shell "build/shells/shell-android/$GAME_STEM-shell.apk" -o "build/templates/$GAME_STEM-android.zip"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: templates
          path: build/templates

  recomp:
    # The recomp program for each desktop system that is on.
    needs: platforms
    if: needs.platforms.outputs.hosts != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.hosts) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.system == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: build
        env:
          # A download: without the debug information the profile keeps.
          CARGO_PROFILE_RELEASE_DEBUG: 'false'
          CARGO_PROFILE_RELEASE_STRIP: 'true'
        run: |
          mkdir -p build/recomp
          b() { cargo build --release --manifest-path recomp/Cargo.toml -p rc-cli "$@"; }
          case "${{ matrix.system }}" in
            windows)
              # The C runtime linked in, so that no Visual C++
              # redistributable is needed.
              RUSTFLAGS="-C target-feature=+crt-static" b
              cp recomp/target/release/recomp.exe build/recomp/ ;;
            macos)
              # One program for Apple silicon and Intel Macs.
              b --target aarch64-apple-darwin
              b --target x86_64-apple-darwin
              lipo -create -output build/recomp/recomp \
                recomp/target/aarch64-apple-darwin/release/recomp \
                recomp/target/x86_64-apple-darwin/release/recomp ;;
            *)
              b
              cp recomp/target/release/recomp build/recomp/ ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: recomp-${{ matrix.system }}
          path: build/recomp

  converters:
    # Each recomp with every template, as the archive a release offers:
    # TropicoRecomp-converter-<system>-<arch>.zip (Windows) or .tar.gz.
    needs: [platforms, templates, recomp]
    if: ${{ !cancelled() && !failure() && needs.platforms.outputs.hosts != '[]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: templates
          path: build/templates
      - uses: actions/download-artifact@v4
        with:
          pattern: recomp-*
          path: build/recomp
      - name: pack
        env:
          HOSTS: ${{ needs.platforms.outputs.hosts }}
        run: |
          jq -r '.[] | "\(.system) \(.arch)"' <<< "$HOSTS" | while read -r system arch; do
            name=TropicoRecomp-converter-$system-$arch
            if [ "$system" = windows ]; then
              tools/package-converter build/recomp/recomp-windows/recomp.exe build/templates "build/converters/$system/$name.zip"
            else
              tools/package-converter "build/recomp/recomp-$system/recomp" build/templates "build/converters/$system/$name.tar.gz"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: contains(needs.platforms.outputs.hosts, '"linux"')
        with:
          name: converter-linux
          path: build/converters/linux
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: contains(needs.platforms.outputs.hosts, '"windows"')
        with:
          name: converter-windows
          path: build/converters/windows
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: contains(needs.platforms.outputs.hosts, '"macos"')
        with:
          name: converter-macos
          path: build/converters/macos
          compression-level: 0

  site:
    needs: [platforms, templates, shell-web]
    # A skipped web shell (the web off) does not hold the site back.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/download-artifact@v4
        with:
          name: templates
          path: build/templates
      - uses: actions/download-artifact@v4
        if: fromJSON(needs.platforms.outputs.on).web
        with:
          name: shell-web
          path: build/shells/shell-web
      - run: tools/build-web build/site build/templates build/shells/shell-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: site
    # Its own condition: without one, a skipped shell further up (a system
    # that is off) would skip the deploy too.
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
