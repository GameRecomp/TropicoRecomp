# SPDX-License-Identifier: MIT
# The converter site: the game shells for Windows, Linux, macOS and Android
# and the web shell for playing in the browser (no game code in any of them),
# the converter compiled to WebAssembly, and the pages,
# published to GitHub Pages. Pages must be enabled with "GitHub Actions" as
# its source.
name: converter

# Manual runs only for now; push is off.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icons:
    # The program's icons, rendered from tools/appimage/tropico.svg.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: tools/make-icons build/icons
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: build/icons

  shell-linux:
    needs: icons
    # The oldest supported runner, so that the shell runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: SDL build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
          libdbus-1-dev libudev-dev libasound2-dev libpulse-dev libpipewire-0.3-dev
      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: build/icons
      - run: tools/build-shell build/out/tropico1-shell
      - run: tools/make-appimage build/out/tropico1-shell build/out/Tropico.AppImage build/icons
      - uses: actions/upload-artifact@v4
        with:
          name: shell-linux
          path: build/out/Tropico.AppImage

  shell-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-shell build/out/Tropico
      - uses: actions/upload-artifact@v4
        with:
          name: shell-macos
          path: build/out/Tropico

  shell-windows:
    needs: icons
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The icon the program's resources carry (games/tropico1/tropico1.rc.in).
      - uses: actions/download-artifact@v4
        with:
          name: icons
          path: build/icons
      - run: tools/build-shell build/out/Tropico.exe
      - uses: actions/upload-artifact@v4
        with:
          name: shell-windows
          path: build/out/Tropico.exe

  shell-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner has the Android SDK (ANDROID_HOME) and NDK
      # (ANDROID_NDK_LATEST_HOME).
      - run: tools/build-android build/out/Tropico-shell.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shell-android
          path: build/out/Tropico-shell.apk

  shell-web:
    # The web shell: the runtime built with Emscripten (JSPI) for playing in
    # the browser, with the Liberation fonts the game's text needs.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten and build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build fonts-liberation
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.0
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.0
      - run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/build-web-shell build/out/web
      - uses: actions/upload-artifact@v4
        with:
          name: shell-web
          path: build/out/web

  site:
    needs: [icons, shell-linux, shell-macos, shell-windows, shell-android, shell-web]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/download-artifact@v4
        with:
          path: build/shells
      - name: shell templates
        run: |
          cargo build --release --manifest-path recomp/Cargo.toml -p rc-cli
          mkdir -p build/templates
          recomp/target/release/recomp template --system linux \
            --shell build/shells/shell-linux/Tropico.AppImage -o build/templates/Tropico-linux.zip
          recomp/target/release/recomp template --system macos \
            --shell build/shells/shell-macos/Tropico -o build/templates/Tropico-macos.zip \
            --version "$(tools/version)" --icon build/shells/icons/tropico.icns
          recomp/target/release/recomp template --system windows \
            --shell build/shells/shell-windows/Tropico.exe -o build/templates/Tropico-windows.zip
          recomp/target/release/recomp template --system android \
            --shell build/shells/shell-android/Tropico-shell.apk -o build/templates/Tropico-android.zip
      - run: tools/build-web build/site build/templates build/shells/shell-web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: site
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
