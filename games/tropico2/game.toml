# SPDX-License-Identifier: MIT
# Tropico 2: Pirate Cove, GOG release (installer setup_tropico2_2.1.0.14.exe).

[game]
id = "tropico2"
title = "Tropico 2: Pirate Cove"
release = "GOG 2.1.0.14"
exe = "Tropico2.exe"
sha256 = "623f22f0766967ae1c6ac793bef671bd89fa33620eacfeb8a68dde3fbe120ec4"
size = 5959680
image_base = 0x00400000

[ingest]
required = [
    "binkw32.dll",
    "Mss32.dll",
    "Data/data.{}",
    "Data/font.{}",
]

[discover]
seeds = []
data = []
noreturn = []

# The statically linked CRT's memcpy and memmove copy a short tail with
# `sub ecx, 4; jb tail; ...; tail: jmp [ecx*4 + table]`, indexing the table
# with -4..-1, as in Tropico 1. Nothing bounds that for the analysis.
tables = [
    { jump = 0x008a7d64, first = -4, count = 4 },
    { jump = 0x008acc44, first = -4, count = 4 },
]

# DLLs the game ships whose code is lifted with it: the Bink video codec of
# this release (its own copy, as for the executable; a newer one than
# Tropico's).
[[modules]]
id = "binkw32"
file = "binkw32.dll"
sha256 = "892a51c4056efcb22297a3b44a3491e3f5888f28b08ed1b17030f24acffedb44"
size = 358963
image_base = 0x30000000

# Changes to what the game does: the code is in patches.c and the files it
# includes; each entry names the patch it belongs to.
[patch]
hooks = [
    0x00867480, # resolution: the width of a screen-size setting
    0x00644a20, # resolution: the HUD's bar draws itself
    0x008dffb0, # resolution: an image window draws itself
    0x008ea170, # resolution: an image draws its picture
    0x008de6e0, # resolution: a window and those in it are drawn
    0x008b91e0, # resolution: a display mode is looked up among those listed
    0x008674e0, # resolution: the height of a screen-size setting
    0x008df1d0, # resolution: the hit test (the window that gets the mouse at a point)
    0x008eb180, # textedit: a behaviour is attached to its window
    0x008eb670, # textedit: and detached
    0x008d1130, # fullscreen: the game goes full screen
    0x008d11d0, # fullscreen: the game goes into a window
    0x006c1d20, # scroll: the world's view takes its scroll step
    0x006cfe00, # scroll: the screen looks whether the pointer is at an edge
    0x008b93f0, # scroll: the Direct3D device's "reduced graphics shifting" is toggled
]
points = [
    0x006a7fda, # resolution: the game screen's layout sizes the HUD's part
    0x006a80af, # resolution: and the world's
    0x006d9adc, # resolution: a slider's value text, just looked up
    0x006d51d7, # resolution: a settings control's title, just looked up
    0x006d656f, # resolution: a radio button's text, just looked up
    0x006d2129, # resolution: a control's status-line text, just looked up
    0x006d66a1, # resolution: a radio group is given its variable
    0x006d2e52, # resolution: the settings page's handler of changes, at 'rend'
    0x006d0629, # resolution: the graphics page has set its slider's value from the size in effect
    0x006d2c98, # resolution: the graphics page takes its slider's value
    0x006d2cd5, # resolution: and has changed to it
    0x006dbbde, # resolution: the menu's settings page has set its slider's value
    0x006dbfa4, # resolution: the menu's settings page takes its slider's value
    0x006dbfd2, # resolution: and has changed to it
    0x008d0d0d, # fullscreen: the start-up reads the full screen preference
    0x006d0601, # fullscreen: the graphics page reads it to tick its box
    0x006d0608, # fullscreen: and has
    0x006d2fb7, # fullscreen: the graphics page reads it after a click on the box
    0x006d2fbe, # fullscreen: and has
    0x006dbbee, # fullscreen: the menu's settings page reads it to tick its box
    0x006dbbf5, # fullscreen: and has
    0x006dc0de, # fullscreen: the menu's settings page reads it after a click on the box
    0x006dc0e5, # fullscreen: and has
    0x008b9504, # scroll: the device reads "reduced graphics shifting" (no edge scrolling)
    0x008b950b, # scroll: and has
    0x008b95b8, # scroll: again
    0x008b95bf, # scroll: and has
    0x008b9682, # scroll: again
    0x008b9689, # scroll: and has
    0x008b9bb3, # scroll: again
    0x008b9bba, # scroll: and has
]
