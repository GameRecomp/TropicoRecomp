# SPDX-License-Identifier: MIT
# Tropico, GOG release (installer setup_tropico_2.1.0.14.exe).
# The executable is the last retail patch with the Paradise Island expansion.

[game]
id = "tropico1"
title = "Tropico"
release = "GOG 2.1.0.14"
exe = "Tropico.EXE"
sha256 = "402432c20b0f664a72dba997dff4bdb10eaaa0dc8ae16ab96debfddf18890432"
size = 1916928
image_base = 0x00400000

[ingest]
required = [
    "binkw32.dll",
    "Mss32.dll",
    "data/px.PK2",
    "data/px2.PK2",
    "data/px3.PK2",
    "data/px4.PK2",
    "data2/Tropico.lng",
    "data2/bldgtype.dat",
    "data2/unittype.dat",
]

[discover]
seeds = []
data = []
noreturn = []

# The statically linked CRT's memcpy and memmove copy a short tail with
# `sub ecx, 4; jb tail; ...; tail: jmp [ecx*4 + table]`, indexing the table
# with -4..-1. Nothing bounds that for the analysis.
tables = [
    { jump = 0x0054d814, first = -4, count = 4 },
    { jump = 0x005507a4, first = -4, count = 4 },
]

# DLLs the game ships whose code is lifted with it: the Bink video codec of
# this release (its own copy, as for the executable).
[[modules]]
id = "binkw32"
file = "binkw32.dll"
sha256 = "f2ad88706cf898ff489c5b3f19fac5a4d51dd59110b8e919b518c1d0f9a9b73a"
size = 291328
image_base = 0x30000000

# Changes to what the game does: the code is in patches.c and the files it
# includes; each entry names the patch it belongs to.
[patch]
hooks = [
    0x004e8710, # options: the function that adds a widget to a page
    0x00526220, # resolution: the painter of images (the world's)
    0x004526d0, # resolution, vtext: the drawer of rotated text
    0x00515450, # resolution, fullscreen: the routine that applies video settings
    0x00491280, # resolution: the options page's handler of changed widgets
]
points = [
    0x00530a51, # resolution: a movie widget's flags, just copied from its record
    0x0040741e, # resolution, vtext: the yearbook's tab labels are drawn
    0x0049179e, # resolution, vtext: the options book's tab labels are drawn
    0x00491127, # fullscreen: the options page has read the windowed flag
    0x0047c375, # fullscreen: the start-up reads the windowed flag
    0x00503a11, # textedit: a text field's loop has read an event
    0x00490c83, # resolution: the options page has made the resolution's label
    0x00490cab, # resolution: the options page sets the resolution slider
]
operands = [
    # resolution: the code that finds a mode's slot compares against slot 4
    # of the table at 0x005a0fa0; it reads the table instead.
    { at = 0x0052d15a, value = 1600, load = 0x005a0fc0 },
    { at = 0x0052d162, value = 1200, load = 0x005a0fc4 },
    # resolution: the world's extent (twice slot 4, in virtual units), from
    # the patch variables at 0x0001f000.
    { at = 0x0046b146, value = 3200, load = 0x0001f000 },
    { at = 0x0046b150, value = 3200, load = 0x0001f000 },
    { at = 0x0046b167, value = 2400, load = 0x0001f004 },
    { at = 0x0046b172, value = 2400, load = 0x0001f004 },
]
code = [
    # resolution: the movie scaler may make a movie larger than it is (two
    # clamps of the destination to the source, jl -> jmp).
    { at = 0x00532065, from = "7c 06", to = "eb 06" },
    { at = 0x00532075, from = "7c 04", to = "eb 04" },
]
